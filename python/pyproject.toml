[build-system]
# >= 77 for the SPDX `license` string; setup.py needs setuptools.command.bdist_wheel (>= 70.1).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "librats"
dynamic = ["version"]
description = "Python bindings for librats P2P networking library"
readme = "README.md"
license = "MIT"
authors = [
    {name = "librats contributors"},
]
keywords = ["p2p", "networking", "file-transfer", "gossipsub", "pubsub", "dht", "mdns", "noise"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/librats/librats/tree/master/python"
Documentation = "https://librats.com"
Repository = "https://github.com/librats/librats"
"Bug Tracker" = "https://github.com/librats/librats/issues"

[tool.setuptools.dynamic]
# Single source of truth; the publish workflow rewrites it from the release tag.
version = {attr = "librats_py.__version__"}

[tool.setuptools.packages.find]
include = ["librats_py*"]

[tool.setuptools.package-data]
librats_py = ["*.so", "*.so.*", "*.dll", "*.dylib"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["librats_py/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "native: needs the librats shared library",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
